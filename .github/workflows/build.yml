name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  OUT: ${{ github.workspace }}/out

jobs:
  # 每次推送都跑：导入工程、跑逻辑测试、用软件 Vulkan（与手机同一套 Mobile 渲染器）截图
  preview:
    name: Test and preview (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot
        id: godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-linux-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          B=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLO $B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          curl -sSLO $B/SHA512-SUMS.txt
          grep "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot

      - name: Install software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers xvfb libgl1 >/dev/null
          mkdir -p "$OUT"

      - name: Cache import
        uses: actions/cache@v4
        with:
          path: game/.godot
          key: import-linux-${{ env.GODOT_VERSION }}-${{ hashFiles('game/assets/**', 'game/project.godot') }}
          restore-keys: import-linux-${{ env.GODOT_VERSION }}-

      - name: Import project
        run: |
          ~/godot/godot --headless --path game --import > "$OUT/import.log" 2>&1 || true
          grep -E -A1 "SCRIPT ERROR|Parse Error" "$OUT/import.log" | head -60 || true
          if grep -q -E "Parse Error|Compile Error" "$OUT/import.log"; then echo "::error::脚本编译不过"; exit 1; fi

      - name: Logic tests
        run: |
          set +e
          timeout 420 ~/godot/godot --headless --path game --fixed-fps 120 -- --autotest > "$OUT/test.log" 2>&1
          code=$?
          tail -120 "$OUT/test.log"
          if grep -q -E "SCRIPT ERROR|Parse Error" "$OUT/test.log"; then echo "::error::脚本报错"; exit 1; fi
          grep -q "AUTOTEST PASS" "$OUT/test.log" || { echo "::error::测试没通过（退出码 $code）"; exit 1; }

      # 不带任何测试参数，走真正的启动流程（读写存档、载图、进菜单），连开两次：第二次会读到第一次的存档
      - name: Normal startup
        run: |
          for n in 1 2; do
            timeout 180 ~/godot/godot --headless --path game --quit-after 400 > "$OUT/startup$n.log" 2>&1 || { tail -20 "$OUT/startup$n.log"; echo "::error::正常启动失败"; exit 1; }
            if grep -q -E "SCRIPT ERROR|Parse Error|缺文件" "$OUT/startup$n.log"; then cat "$OUT/startup$n.log" | head -40; echo "::error::正常启动有脚本错误"; exit 1; fi
            grep -E "\[APEX\]" "$OUT/startup$n.log"
          done

      - name: Screenshots
        if: success() || failure()
        run: |
          mkdir -p "$OUT/shots"
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          timeout 600 xvfb-run -a -s "-screen 0 1440x900x24" ~/godot/godot --path game --rendering-method mobile --rendering-driver vulkan \
            --resolution 1334x616 --fixed-fps 60 -- --shots="$OUT/shots" > "$OUT/shots.log" 2>&1 || true
          grep -E "SCRIPT ERROR|ERROR|\[APEX\]" "$OUT/shots.log" | head -60 || true
          ls "$OUT/shots"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: preview
          path: ${{ env.OUT }}
          if-no-files-found: ignore

  # 提交信息里带 [ipa] 或手动触发时才出包
  ios:
    name: iOS (unsigned IPA)
    needs: preview
    if: contains(github.event.head_commit.message, '[ipa]') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5

      - name: Environment
        run: |
          sw_vers; xcodebuild -version
          mkdir -p "$OUT/logs" "$OUT/screenshots"

      - name: Cache Godot and iOS template
        id: godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-macos-ios-${{ env.GODOT_VERSION }}

      - name: Download Godot and iOS template
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          B=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLO $B/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          curl -sSLO $B/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          curl -sSLO $B/SHA512-SUMS.txt
          for f in Godot_v${GODOT_VERSION}-stable_macos.universal.zip Godot_v${GODOT_VERSION}-stable_export_templates.tpz; do
            [ "$(shasum -a 512 $f | cut -d' ' -f1)" = "$(grep " $f$" SHA512-SUMS.txt | cut -d' ' -f1)" ] || { echo "::error::$f 校验失败"; exit 1; }
          done
          unzip -q Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/ios.zip' 'templates/version.txt' -d tpl
          rm -f *.zip *.tpz; mv tpl/ios.zip ios_template.zip; mv tpl/version.txt .; ls -la

      - name: Install template
        run: |
          D="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$D"; cp ~/godot/ios_template.zip "$D/ios.zip"; cp ~/godot/version.txt "$D/"

      - name: Cache import
        uses: actions/cache@v4
        with:
          path: game/.godot
          key: import-macos-${{ env.GODOT_VERSION }}-${{ hashFiles('game/assets/**', 'game/project.godot') }}
          restore-keys: import-macos-${{ env.GODOT_VERSION }}-

      - name: Export Xcode project
        run: |
          G=~/godot/Godot.app/Contents/MacOS/Godot
          "$G" --headless --path game --import > "$OUT/logs/import.log" 2>&1 || true
          mkdir -p build/ios
          "$G" --headless --path game --export-release "iOS" "$PWD/build/ios/ApexDrift.ipa" > "$OUT/logs/export.log" 2>&1 || true
          tail -30 "$OUT/logs/export.log"
          ls build/ios; du -sh build/ios
          test -d build/ios/ApexDrift.xcodeproj

      - name: Build device app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project build/ios/ApexDrift.xcodeproj -scheme ApexDrift -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            > "$OUT/logs/ios-device-build.log" 2>&1 || { grep -E "error:|FAILED" "$OUT/logs/ios-device-build.log" | head -30; exit 1; }
          APP=$(find build/device/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "DEVICE_APP=$APP" >> "$GITHUB_ENV"
          ls -la "$APP" | head -30; du -sh "$APP"

      - name: Check that 120 Hz is unlocked
        run: |
          P="$DEVICE_APP/Info.plist"
          plutil -convert xml1 -o "$OUT/logs/Info.plist" "$P"
          V=$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$P")
          echo "CADisableMinimumFrameDurationOnPhone=$V"
          [ "$V" = "true" ] || { echo "::error::没有解除 60fps 限制"; exit 1; }
          grep -q 'window/ios/allow_high_refresh_rate=false' game/project.godot && { echo "::error::工程关掉了高刷新率"; exit 1; } || true
          lipo -archs "$DEVICE_APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$P")"

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$DEVICE_APP" "$RUNNER_TEMP/unsigned/Payload/"
          (cd "$RUNNER_TEMP/unsigned" && zip -qry "$OUT/ApexDriftMobile-unsigned.ipa" Payload)
          ls -la "$OUT"/*.ipa

      - uses: actions/upload-artifact@v6
        with:
          name: ios-app
          path: ${{ env.OUT }}/*.ipa

      # Godot 官方 iOS 模板的模拟器库只有 x86_64，且模拟器不支持 Mobile/Metal 渲染器，所以改在 macOS 上
      # 用同一套 Mobile 渲染器 + Metal 驱动跑真画面（着色器走 Metal 编译），再关垂直同步跑一遍分。
      - name: Metal run on macOS
        run: |
          G=~/godot/Godot.app/Contents/MacOS/Godot
          system_profiler SPDisplaysDataType | head -20; sysctl -n machdep.cpu.brand_string
          mkdir -p "$OUT/screenshots/metal"
          run() { local lim=$1 log=$2; shift 2; "$@" > "$log" 2>&1 & local p=$!; for i in $(seq 1 $lim); do sleep 1; kill -0 $p 2>/dev/null || break; done; kill -9 $p 2>/dev/null || true; }
          run 420 "$OUT/logs/metal-shots.log" "$G" --path game --rendering-method mobile --rendering-driver metal --resolution 1334x616 --fixed-fps 60 -- --shots="$OUT/screenshots/metal"
          grep -E "\[APEX\]|ERROR|SHADER|SCRIPT" "$OUT/logs/metal-shots.log" | head -50 || true
          # 直接跑导出的 pck（和 IPA 里的是同一份），确认资源打全了
          mkdir -p "$OUT/screenshots/pck"; ls -la build/ios/*.pck "$DEVICE_APP"/*.pck || true
          run 300 "$OUT/logs/metal-pck.log" "$G" --main-pack "$DEVICE_APP/ApexDrift.pck" --rendering-method mobile --rendering-driver metal --resolution 1334x616 --fixed-fps 60 -- --shots="$OUT/screenshots/pck"
          grep -E "\[APEX\]|ERROR|SCRIPT" "$OUT/logs/metal-pck.log" | head -40 || true
          run 200 "$OUT/logs/metal-bench.log" "$G" --path game --rendering-method mobile --rendering-driver metal --resolution 1920x1080 -- --bench
          grep -E "\[BENCH\]|\[APEX\]|ERROR" "$OUT/logs/metal-bench.log" | head -30 || true
          mkdir -p "$OUT/logs/crashes"; find ~/Library/Logs/DiagnosticReports -name "Godot*" -exec cp {} "$OUT/logs/crashes/" \; 2>/dev/null || true
          grep -q "shot ui_pause" "$OUT/logs/metal-shots.log" || { echo "::error::Metal 截图没跑完"; exit 1; }
          if grep -q -E "Failed to compile Metal library|out of bounds" "$OUT/logs/metal-shots.log"; then echo "::error::有着色器在 Metal 上编译不过"; exit 1; fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-logs
          path: |
            ${{ env.OUT }}/logs
            ${{ env.OUT }}/screenshots
          if-no-files-found: ignore

  # 提交信息里带 [apk] 或手动触发时出安卓包（ubuntu 构建机，免费）。
  # 签名：仓库配了 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS 三个 secrets 就用用户自己的证书
  # （用 scripts/set-android-signing.sh 设置）；没配就每次临时生成调试密钥库，签名每次都不同，覆盖安装前要先卸载旧版。
  android:
    name: Android (signed APK)
    needs: preview
    if: contains(github.event.head_commit.message, '[apk]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PKG: com.adamdashen666.apexdriftmobile
      BUILD_TOOLS: "36.1.0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and Android template
        id: godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-linux-android-${{ env.GODOT_VERSION }}

      - name: Download Godot and Android template
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          B=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLO $B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          curl -sSLO $B/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          curl -sSLO $B/SHA512-SUMS.txt
          for f in Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip Godot_v${GODOT_VERSION}-stable_export_templates.tpz; do
            [ "$(sha512sum $f | cut -d' ' -f1)" = "$(grep " $f$" SHA512-SUMS.txt | cut -d' ' -f1)" ] || { echo "::error::$f 校验失败"; exit 1; }
          done
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/android_source.zip' 'templates/version.txt' -d tpl
          rm -f *.zip *.tpz; ls -la . tpl

      - name: Android SDK, editor settings and signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p "$OUT/logs"
          # 官方导出模板（gradle 工程源码）
          D=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$D" && cp ~/godot/tpl/* "$D/"
          # 构建机自带的 Android SDK，补上 Godot 4.7 模板要的 build-tools / platform
          echo "ANDROID_HOME=$ANDROID_HOME JAVA_HOME=$JAVA_HOME"; java -version 2>&1 | head -1 || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "build-tools;$BUILD_TOOLS" "platforms;android-36" "platform-tools" > "$OUT/logs/sdkmanager.log" 2>&1 || { tail -20 "$OUT/logs/sdkmanager.log"; exit 1; }
          ls "$ANDROID_HOME/build-tools"
          # Godot 编辑器设置：SDK 和 JDK 路径
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres
          cat ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres
          # 签名密钥库：放在仓库外的临时目录，构建结束随构建机销毁
          K="$RUNNER_TEMP/keys"; mkdir -p "$K"; chmod 700 "$K"
          if [ -n "$KS_B64" ]; then
            [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] || { echo "::error::配了 ANDROID_KEYSTORE_BASE64，但缺 ANDROID_KEYSTORE_PASSWORD 或 ANDROID_KEY_ALIAS"; exit 1; }
            echo "$KS_B64" | base64 -d > "$K/release.keystore"
            keytool -list -keystore "$K/release.keystore" -storepass "$KS_PASS" -alias "$KS_ALIAS" > /dev/null || { echo "::error::用户密钥库打不开（密码或别名不对）"; exit 1; }
            echo "SIGN_MODE=user" >> "$GITHUB_ENV"
            echo "签名：仓库 secrets 里的用户证书"
          else
            keytool -genkeypair -keystore "$K/release.keystore" -storetype PKCS12 -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
            echo "SIGN_MODE=debug" >> "$GITHUB_ENV"
            echo "签名：本次构建临时生成的调试密钥库（androiddebugkey），每次构建都不同"
          fi

      - name: Restore import cache
        uses: actions/cache/restore@v4
        with:
          path: game/.godot
          key: import-linux-${{ env.GODOT_VERSION }}-${{ hashFiles('game/assets/**', 'game/project.godot') }}
          restore-keys: import-linux-${{ env.GODOT_VERSION }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-godot-${{ env.GODOT_VERSION }}

      - name: Export APK (gradle build)
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/keys/release.keystore
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ "$SIGN_MODE" = user ]; then
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KS_ALIAS" GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KS_PASS"
          else
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android
          fi
          G=~/godot/godot
          mkdir -p build/android
          "$G" --headless --path game --import > "$OUT/logs/import.log" 2>&1 || true
          if grep -q -E "Parse Error|Compile Error" "$OUT/logs/import.log"; then grep -E -A1 "SCRIPT ERROR|Parse Error" "$OUT/logs/import.log" | head -40; exit 1; fi
          # versionCode 用构建序号，保证一次比一次大（用同一个证书时才能直接覆盖安装）
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" game/export_presets.cfg
          "$G" --headless --path game --install-android-build-template --export-release "Android" "$PWD/build/android/ApexDriftMobile.apk" > "$OUT/logs/export.log" 2>&1 || true
          tail -25 "$OUT/logs/export.log"
          if [ ! -f build/android/ApexDriftMobile.apk ]; then
            grep -n -E "ERROR|error:|What went wrong|FAILURE" -A6 "$OUT/logs/export.log" | head -80 || true
            echo "::error::APK 没导出来"; exit 1
          fi
          # 再导一个 x86_64 的测试包，只给 CI 的模拟器用，不发布
          sed -i -e 's/^architectures\/arm64-v8a=true/architectures\/arm64-v8a=false/' -e 's/^architectures\/x86_64=false/architectures\/x86_64=true/' game/export_presets.cfg
          "$G" --headless --path game --export-release "Android" "$PWD/build/android/emu-x86_64.apk" > "$OUT/logs/export-x86_64.log" 2>&1 || true
          git checkout -- game/export_presets.cfg
          ls -la build/android
          # 用户证书的密码不能出现在要上传的日志里
          if [ "$SIGN_MODE" = user ]; then
            for f in "$OUT"/logs/*.log; do
              python3 -c 'import os, sys; p = sys.argv[1]; s = open(p, encoding="utf-8", errors="replace").read(); open(p, "w", encoding="utf-8").write(s.replace(os.environ["KS_PASS"], "***"))' "$f"
            done
          fi

      - name: Check APK (signature, manifest, ABI, size, contents)
        run: |
          A=build/android/ApexDriftMobile.apk
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          L="$OUT/logs"
          "$BT/apksigner" verify --verbose --print-certs "$A" > "$L/apksigner.txt" 2>&1 || { cat "$L/apksigner.txt"; echo "::error::签名校验失败"; exit 1; }
          grep -E "Verified using|Signer #1 certificate DN|Signer #1 certificate SHA-256" "$L/apksigner.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$L/apksigner.txt" || { echo "::error::没有 v2 签名"; exit 1; }
          "$BT/aapt2" dump badging "$A" > "$L/badging.txt"
          grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|application-label:|application-isGame|native-code|uses-permission)" "$L/badging.txt"
          grep -q "^package: name='$PKG'" "$L/badging.txt" || { echo "::error::包名不对"; exit 1; }
          grep -q -E "^(min)?[sS]dkVersion:'29'" "$L/badging.txt" || { echo "::error::最低系统版本不是 API 29"; exit 1; }
          [ "$(grep '^native-code:' "$L/badging.txt")" = "native-code: 'arm64-v8a'" ] || { echo "::error::ABI 不是只有 arm64-v8a"; exit 1; }
          grep -q "^application-label:'APEX DRIFT'" "$L/badging.txt" || { echo "::error::显示名不对"; exit 1; }
          perms=$(grep -oP "^uses-permission: name='\K[^']+" "$L/badging.txt" | sort -u)
          echo "$perms" | grep -qx android.permission.VIBRATE || { echo "::error::缺震动权限"; exit 1; }
          extra=$(echo "$perms" | grep -v -x -e android.permission.VIBRATE -e "$PKG.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" || true)
          [ -z "$extra" ] || { echo "::error::多了用不到的权限: $extra"; exit 1; }
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$A" > "$L/manifest.txt"
          grep -E "screenOrientation|isGame|appCategory|extractNativeLibs" "$L/manifest.txt" || true
          # 桌面入口是 activity-alias（aapt2 的 badging 不把它算 launchable-activity），这里直接查清单
          grep -q "android.intent.category.LAUNCHER" "$L/manifest.txt" || { echo "::error::没有桌面入口"; exit 1; }
          unzip -l "$A" > "$L/apk-contents.txt"
          for f in assets/assets.sparsepck assets/CREDITS.txt; do
            grep -q " $f$" "$L/apk-contents.txt" || { echo "::error::APK 里缺 $f"; exit 1; }
          done
          grep -E " lib/" "$L/apk-contents.txt" || true
          echo "APK 内最大的文件："; sort -k1 -n -r "$L/apk-contents.txt" | head -8 || true
          SZ=$(stat -c%s "$A"); echo "APK 大小 $((SZ / 1048576)) MB（$SZ 字节）"
          [ "$SZ" -lt $((200 * 1048576)) ] || { echo "::error::APK 超过 200MB"; exit 1; }
          cp "$A" "$OUT/ApexDriftMobile.apk"
          (cd "$OUT" && sha256sum ApexDriftMobile.apk > ApexDriftMobile.apk.sha256 && cat ApexDriftMobile.apk.sha256)
          VC=$(grep -oP "versionCode='\K[0-9]+" "$L/badging.txt"); VN=$(grep -oP "versionName='\K[^']+" "$L/badging.txt")
          printf '包名 %s\n版本 %s（versionCode %s）\n最低 Android 10（API 29）\nABI arm64-v8a\n大小 %s 字节\n签名 %s\n' "$PKG" "$VN" "$VC" "$SZ" "$SIGN_MODE" > "$OUT/apk-info.txt"
          cat "$OUT/apk-info.txt"

      - uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: |
            ${{ env.OUT }}/ApexDriftMobile.apk
            ${{ env.OUT }}/ApexDriftMobile.apk.sha256
            ${{ env.OUT }}/apk-info.txt

      # 把 APK 里的数据（assets/ 下的 sparse pck 和它引用的各个文件）解出来，用 Linux 版 Godot 加软件 Vulkan
      # 跑一遍截图，确认资源打全了（安卓包里的贴图是 ETC2/ASTC）
      - name: Run the APK's pck on Linux (software Vulkan)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers xvfb libgl1 >/dev/null
          X="$RUNNER_TEMP/apk_x"; rm -rf "$X"; mkdir -p "$X" "$OUT/screenshots/apk-pck"
          unzip -q build/android/ApexDriftMobile.apk 'assets/*' -d "$X"
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          timeout 600 xvfb-run -a -s "-screen 0 1440x900x24" ~/godot/godot --main-pack "$X/assets/assets.sparsepck" --rendering-method mobile --rendering-driver vulkan \
            --resolution 1334x616 --fixed-fps 60 -- --shots="$OUT/screenshots/apk-pck" > "$OUT/logs/apk-pck.log" 2>&1 || true
          grep -E "SCRIPT ERROR|ERROR|\[APEX\]" "$OUT/logs/apk-pck.log" | head -60 || true
          ls "$OUT/screenshots/apk-pck"
          grep -q "shot ui_pause" "$OUT/logs/apk-pck.log" || { echo "::error::APK 里的 pck 没跑完截图"; exit 1; }
          if grep -q -E "SCRIPT ERROR|Parse Error|缺文件|Can't open pack-referenced|No loader found" "$OUT/logs/apk-pck.log"; then echo "::error::APK 里的 pck 有脚本错误或缺资源"; exit 1; fi

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 模拟器冒烟测试（x86_64 测试包，软件渲染）：能装、能启动进菜单、返回键不退出。失败不挡出包，看日志和截图。
      - name: Emulator smoke test
        continue-on-error: true
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android-emu-test.sh build/android/emu-x86_64.apk "$OUT/emulator"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-logs
          path: |
            ${{ env.OUT }}/logs
            ${{ env.OUT }}/screenshots
            ${{ env.OUT }}/emulator
          if-no-files-found: ignore
