name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  OUT: ${{ github.workspace }}/out

jobs:
  # 每次推送都跑：导入工程、跑逻辑测试、用软件 Vulkan（与手机同一套 Mobile 渲染器）截图
  preview:
    name: Test and preview (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot
        id: godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-linux-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          B=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLO $B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          curl -sSLO $B/SHA512-SUMS.txt
          grep "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot

      - name: Install software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers xvfb libgl1 >/dev/null
          mkdir -p "$OUT"

      - name: Cache import
        uses: actions/cache@v4
        with:
          path: game/.godot
          key: import-linux-${{ env.GODOT_VERSION }}-${{ hashFiles('game/assets/**', 'game/project.godot') }}
          restore-keys: import-linux-${{ env.GODOT_VERSION }}-

      - name: Import project
        run: |
          ~/godot/godot --headless --path game --import > "$OUT/import.log" 2>&1 || true
          grep -E "SCRIPT ERROR|Parse Error|ERROR" "$OUT/import.log" | head -40 || true

      - name: Logic tests
        run: |
          set +e
          timeout 900 ~/godot/godot --headless --path game --fixed-fps 120 -- --autotest > "$OUT/test.log" 2>&1
          code=$?
          tail -120 "$OUT/test.log"
          if grep -q -E "SCRIPT ERROR|Parse Error" "$OUT/test.log"; then echo "::error::脚本报错"; exit 1; fi
          grep -q "AUTOTEST PASS" "$OUT/test.log" || { echo "::error::测试没通过（退出码 $code）"; exit 1; }

      - name: Screenshots
        if: success() || failure()
        run: |
          mkdir -p "$OUT/shots"
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          timeout 1200 xvfb-run -a -s "-screen 0 1440x900x24" ~/godot/godot --path game --rendering-method mobile --rendering-driver vulkan \
            --resolution 1334x616 --fixed-fps 60 -- --shots="$OUT/shots" > "$OUT/shots.log" 2>&1 || true
          grep -E "SCRIPT ERROR|ERROR|\[APEX\]" "$OUT/shots.log" | head -60 || true
          ls "$OUT/shots"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: preview
          path: ${{ env.OUT }}
          if-no-files-found: ignore

  # 提交信息里带 [ipa] 或手动触发时才出包
  ios:
    name: iOS (unsigned IPA)
    needs: preview
    if: contains(github.event.head_commit.message, '[ipa]') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5

      - name: Environment
        run: |
          sw_vers; xcodebuild -version
          mkdir -p "$OUT/logs" "$OUT/screenshots"

      - name: Cache Godot and iOS template
        id: godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-macos-ios-${{ env.GODOT_VERSION }}

      - name: Download Godot and iOS template
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          B=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLO $B/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          curl -sSLO $B/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          curl -sSLO $B/SHA512-SUMS.txt
          for f in Godot_v${GODOT_VERSION}-stable_macos.universal.zip Godot_v${GODOT_VERSION}-stable_export_templates.tpz; do
            [ "$(shasum -a 512 $f | cut -d' ' -f1)" = "$(grep " $f$" SHA512-SUMS.txt | cut -d' ' -f1)" ] || { echo "::error::$f 校验失败"; exit 1; }
          done
          unzip -q Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/ios.zip' 'templates/version.txt' -d tpl
          rm -f *.zip *.tpz; mv tpl/ios.zip ios_template.zip; mv tpl/version.txt .; ls -la

      - name: Install template
        run: |
          D="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$D"; cp ~/godot/ios_template.zip "$D/ios.zip"; cp ~/godot/version.txt "$D/"

      - name: Cache import
        uses: actions/cache@v4
        with:
          path: game/.godot
          key: import-macos-${{ env.GODOT_VERSION }}-${{ hashFiles('game/assets/**', 'game/project.godot') }}
          restore-keys: import-macos-${{ env.GODOT_VERSION }}-

      - name: Export Xcode project
        run: |
          G=~/godot/Godot.app/Contents/MacOS/Godot
          "$G" --headless --path game --import > "$OUT/logs/import.log" 2>&1 || true
          mkdir -p build/ios
          "$G" --headless --path game --export-release "iOS" "$PWD/build/ios/ApexDrift.ipa" > "$OUT/logs/export.log" 2>&1 || true
          tail -30 "$OUT/logs/export.log"
          ls build/ios; du -sh build/ios
          test -d build/ios/ApexDrift.xcodeproj

      - name: Build device app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project build/ios/ApexDrift.xcodeproj -scheme ApexDrift -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            > "$OUT/logs/ios-device-build.log" 2>&1 || { grep -E "error:|FAILED" "$OUT/logs/ios-device-build.log" | head -30; exit 1; }
          APP=$(find build/device/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "DEVICE_APP=$APP" >> "$GITHUB_ENV"
          ls -la "$APP" | head -30; du -sh "$APP"

      - name: Check that 120 Hz is unlocked
        run: |
          P="$DEVICE_APP/Info.plist"
          plutil -convert xml1 -o "$OUT/logs/Info.plist" "$P"
          V=$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$P")
          echo "CADisableMinimumFrameDurationOnPhone=$V"
          [ "$V" = "true" ] || { echo "::error::没有解除 60fps 限制"; exit 1; }
          grep -q 'window/ios/allow_high_refresh_rate=false' game/project.godot && { echo "::error::工程关掉了高刷新率"; exit 1; } || true
          lipo -archs "$DEVICE_APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$P")"

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$DEVICE_APP" "$RUNNER_TEMP/unsigned/Payload/"
          (cd "$RUNNER_TEMP/unsigned" && zip -qry "$OUT/ApexDriftMobile-unsigned.ipa" Payload)
          ls -la "$OUT"/*.ipa

      - uses: actions/upload-artifact@v6
        with:
          name: ios-app
          path: ${{ env.OUT }}/*.ipa

      # 模拟器：启动、截图、看有没有崩溃（模拟器不代表真机帧率）
      - name: Simulator smoke test
        if: success() || failure()
        continue-on-error: true
        run: |
          xcodebuild build -project build/ios/ApexDrift.xcodeproj -scheme ApexDrift -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$OUT/logs/ios-sim-build.log" 2>&1 || { grep -E "error:|FAILED" "$OUT/logs/ios-sim-build.log" | head -20; }
          APP=$(find build/sim/Build/Products -maxdepth 2 -name "*.app" | head -1)
          [ -n "$APP" ] || { echo "::warning::模拟器版没编出来"; exit 0; }
          lipo -archs "$APP/ApexDrift" || true
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl list devices available -j > "$RUNNER_TEMP/sims.json"
          UDID=$(jq -r '[.devices | to_entries[] | select(.key|contains("iOS")) | .value[] | select(.name|startswith("iPhone"))] | last | .udid' "$RUNNER_TEMP/sims.json")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          codesign -s - --force --deep "$APP" || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --terminate-running-process --stdout="$OUT/logs/sim-stdout.log" --stderr="$OUT/logs/sim-stdout.log" "$UDID" "$BID" || true
          for i in 1 2 3; do sleep 12; xcrun simctl io "$UDID" screenshot "$OUT/screenshots/sim-$i.png" || true; done
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "ApexDrift"' --style compact > "$OUT/logs/sim-runtime.log" 2>&1 || true
          pgrep -f "ApexDrift.app/ApexDrift" >/dev/null && echo "模拟器里 App 在运行" || echo "::warning::模拟器里 App 没有在运行"
          mkdir -p "$OUT/logs/crashes"; find ~/Library/Logs/DiagnosticReports -name "ApexDrift*" -exec cp {} "$OUT/logs/crashes/" \; 2>/dev/null || true
          tail -40 "$OUT/logs/sim-stdout.log" || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-logs
          path: |
            ${{ env.OUT }}/logs
            ${{ env.OUT }}/screenshots
          if-no-files-found: ignore
